static_resources:
  listeners:
  - name: ingress_edge_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 443 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          generate_request_id: true
          tracing:
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.tracers.opentelemetry.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: otel_collector_grpc
                  timeout: 0.250s
                service_name: ingress-gateway
            client_sampling:
              value: 100.0
            overall_sampling:
              value: 100.0
            random_sampling:
              value: 100.0
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend_services
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: internal_backend_service }

  clusters:
  - name: otel_collector_grpc
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: otel_collector_grpc
      endpoints:
      - lb_endpoints:
        - endpoint:
            socket_address:
              address: otel-collector.monitoring.svc.cluster.local
              port_value: 4317

# OpenTelemetry Collector - Zero-Trust Security, PII Redaction & Multi-Tenancy
# Mutual TLS (mTLS) with client cert validation, redactionprocessor, and tenant routing

receivers:
  # Secure gRPC receiver requiring valid client certificate
  otlp/mtls:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/otel/certs/server.crt
          key_file: /etc/otel/certs/server.key
          client_ca_file: /etc/otel/certs/ca.crt
          client_auth_type: RequireAndVerifyClientCert
          min_version: "1.3"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Redaction processor: sanitizes PII and enforces attribute allowlisting
  redaction:
    allowlist_attributes:
      - service.name
      - service.version
      - http.method
      - http.status_code
      - http.route
      - k8s.namespace.name
      - k8s.pod.name
      - host.name
    blocked_values:
      # Bearer authorization tokens
      - "(?i)bearer\\s+[a-zA-Z0-9_\\-\\.]+.*"
      # Credit card numbers (Visa, Mastercard, Amex)
      - "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\\b"
      # US Social Security Number
      - "\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b"
      # Passwords and API secrets
      - "(?i)(password|secret|apikey|api_key)\\s*[:=]\\s*\\S+"
    summary: silent

  # Multi-tenant router directing telemetry to tenant-specific pipelines
  routing/by_tenant:
    from_attribute: "X-Scope-OrgID"
    attribute_source: context
    table:
      - value: "tenant-enterprise-alpha"
        exporters: [otlp/tenant_alpha]
      - value: "tenant-enterprise-beta"
        exporters: [otlp/tenant_beta]
    default_exporters: [otlp/shared_default]

  batch:
    send_batch_size: 8192
    timeout: 3s

exporters:
  otlp/tenant_alpha:
    endpoint: tempo-alpha.internal:4317
    headers:
      X-Scope-OrgID: "tenant-enterprise-alpha"
    tls:
      ca_file: /etc/otel/certs/ca.crt

  otlp/tenant_beta:
    endpoint: tempo-beta.internal:4317
    headers:
      X-Scope-OrgID: "tenant-enterprise-beta"
    tls:
      ca_file: /etc/otel/certs/ca.crt

  otlp/shared_default:
    endpoint: tempo-shared.internal:4317
    headers:
      X-Scope-OrgID: "sandbox"
    tls:
      ca_file: /etc/otel/certs/ca.crt

service:
  pipelines:
    traces:
      receivers: [otlp/mtls]
      processors: [memory_limiter, redaction, batch]
      exporters: [routing/by_tenant]

# ========================================================================
# Grafana Loki Production Configuration
# TSDB Index Format with Native OTel Structured Metadata
# ========================================================================

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /var/loki
  storage:
    s3:
      endpoint: s3.us-east-1.amazonaws.com
      bucketnames: enterprise-loki-logs
      insecure: false
  replication_factor: 3
  ring:
    kvstore:
      store: memberlist

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 3
  chunk_idle_period: 30m
  chunk_retain_period: 1m
  max_chunk_age: 2h
  wal:
    enabled: true
    dir: /var/loki/wal

compactor:
  working_directory: /var/loki/compactor
  shared_store: s3
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  retention_period: 30d
  ingestion_rate_mb: 25
  ingestion_burst_size_mb: 50
  max_entries_limit_per_query: 5000
  max_global_streams_per_user: 100000
  # Native support for OpenTelemetry JSON attributes as structured metadata
  # without causing label cardinality explosion!
  allow_structured_metadata: true
  volume_enabled: true

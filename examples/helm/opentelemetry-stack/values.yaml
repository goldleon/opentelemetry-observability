# Production OpenTelemetry Helm Values

global:
  clusterName: "production-us-east-1"
  environment: "production"

# Gateway StatefulSet configuration (Tier 2 aggregator & tail-sampler)
gateway:
  enabled: true
  replicaCount: 3
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.96.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "4000m"
      memory: "8Gi"
    requests:
      cpu: "2000m"
      memory: "4Gi"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  persistence:
    enabled: true
    storageClassName: gp3
    size: 20Gi
    mountPath: /var/lib/otelcol/queue

# Node DaemonSet Agent configuration (Tier 1 host receiver & enricher)
agent:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.96.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

# Target Storage Endpoints
backends:
  tempo:
    endpoint: "tempo-distributor.monitoring.svc:4317"
    insecure: true
  mimir:
    endpoint: "mimir-distributor.monitoring.svc:4317"
    insecure: true
  loki:
    endpoint: "loki-gateway.monitoring.svc:4317"
    insecure: true

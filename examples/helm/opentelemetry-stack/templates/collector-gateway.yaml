{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-gateway
    app.kubernetes.io/component: gateway
spec:
  serviceName: {{ .Release.Name }}-gateway-headless
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-gateway
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: otel-gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command:
            - "/otelcol-contrib"
            - "--config=/conf/collector.yaml"
          env:
            - name: GOMEMLIMIT
              value: "6800MiB"
            - name: GOMAXPROCS
              value: "4"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
            {{- if .Values.gateway.persistence.enabled }}
            - name: queue-storage
              mountPath: {{ .Values.gateway.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-gateway-config
  {{- if .Values.gateway.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: queue-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.gateway.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.gateway.persistence.size }}
  {{- end }}
{{- end }}
